<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="format-detection" content="telephone=no" />
        <meta name="msapplication-tap-highlight" content="no" />
        <!-- WARNING: for iOS 7, remove the width=device-width and height=device-height attributes. See https://issues.apache.org/jira/browse/CB-4323 -->
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script>
            // Appearance from the settings (names.js), before the page is drawn: "Always dark" (default off) and
            // "Keep Dark Reader off this site" (default on: Dark Reader only reads this when the page loads)
            (function () {
                function On(key, def) {
                    try {
                        var v = localStorage["SETTING" + key];
                        return v === undefined || v === null ? def : v == "true";
                    } catch (e) {
                        return def;
                    }
                }
                if (On("AlwaysDark", false))
                    document.documentElement.className += " dark";
                if (On("DarkReaderLock", true)) {
                    var lock = document.createElement("meta");
                    lock.name = "darkreader-lock";
                    document.head.appendChild(lock);
                }
            })();
        </script>
        <link rel="stylesheet" type="text/css" href="css/index.css?v=33" />
        <link rel="manifest" href="manifest.webmanifest" />
        <meta name="theme-color" content="#0f6e78" />
        <link rel="apple-touch-icon" href="icons/icon-192.png" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <title>RegEx puzzles</title>
    </head>
    <body>
        <div id="Puzzles"></div>
        <script src="js/names.js?v=33"></script>
        <script src="js/Overview.js?v=33"></script>
    </body>
</html>
